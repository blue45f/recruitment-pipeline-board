sonar.projectKey=recruitment-pipeline-board
sonar.projectName=Recruitment Pipeline Board
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,cypress
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,cypress/**/*.cy.ts,cypress/**/*.cy.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/**/*.stories.tsx,src/main.tsx,src/mocks/**,src/test/**
